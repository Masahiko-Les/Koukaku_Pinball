name: KoukakuPinball
options:
  bundleIdPrefix: com.mfujita.koukakupinball
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  KoukakuPinball:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KoukakuPinball/Sources
    info:
      path: KoukakuPinball/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
        NSCameraUsageDescription: "口角の動きを認識してゲーム操作に使用するため、カメラを使用します。映像は保存・送信されません。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mfujita.koukakupinball.KoukakuPinball
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LVRD7J24XF
        ENABLE_PREVIEWS: "YES"
